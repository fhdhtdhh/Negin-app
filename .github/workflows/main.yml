name: Build Negin APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp icon-512-3.png www/icon-512.png
          cp icon-512-3.png www/icon-192.png
          npx cap init "Negin App" com.negin.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Install Pillow
        run: pip3 install pillow

      - name: Set Icons
        run: |
          python3 -c '
from PIL import Image
import os
img = Image.open("icon-512-3.png").convert("RGBA")
sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
for name, size in sizes.items():
    path = f"android/app/src/main/res/mipmap-{name}"
    os.makedirs(path, exist_ok=True)
    r = img.resize((size, size), Image.LANCZOS)
    r.save(f"{path}/ic_launcher.png")
    r.save(f"{path}/ic_launcher_round.png")
    r.save(f"{path}/ic_launcher_foreground.png")
print("Icons OK")
'

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Negin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
