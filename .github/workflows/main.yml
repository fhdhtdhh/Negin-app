name: Build Negin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/
          npx cap init "Negin App" com.negin.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Install Pillow
        run: python3 -m pip install --upgrade pillow

      - name: Set Android Icons
        run: |
          python3 << 'PY'
          from PIL import Image
          import os
          img = Image.open("icon-512.png").convert("RGBA")
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              resized = img.resize((size, size), Image.LANCZOS)
              resized.save(f"{path}/ic_launcher.png")
              resized.save(f"{path}/ic_launcher_round.png")
          print("Icons set!")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Negin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
