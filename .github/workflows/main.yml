name: Build Negin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          mkdir -p www
          cp index.html www/
          cp manifest.webmanifest www/
          cp sw.js www/

          # Find the newest 512px icon
          ICON=$(find . -maxdepth 1 -type f -name 'icon-512*.png' | head -n 1)

          if [ -z "$ICON" ]; then
            echo "ERROR: 512px icon not found"
            exit 1
          fi

          echo "Using icon: $ICON"

          cp "$ICON" www/icon-512.png

          npx cap init "Negin App" com.negin.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow

      - name: Set Negin Android Icon
        run: |
          python3 <<'PY'
          from PIL import Image
          import os
          import re

          # Find the Negin icon
          files = [
              f for f in os.listdir(".")
              if f.startswith("icon-512") and f.endswith(".png")
          ]

          if not files:
              raise SystemExit("ERROR: icon-512 PNG not found")

          source = files[0]
          print("Using:", source)

         
