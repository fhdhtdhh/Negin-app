<style>
:root{
  --bg:#faf6ee; --panel:#ffffff; --line:#e8dcc4; --ivory:#2b1a20; --muted:#7a6a5e; --gold:#b08a2e; --gold2:#8a6a1c; --wine:#7a1f35;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ivory);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.8;min-height:100%}
header{text-align:center;padding:56px 20px 28px;background:radial-gradient(ellipse at 50% 0,#3a1b26 0,transparent 70%)}
.crest{width:64px;height:64px;margin:0 auto 14px;display:block}
h1{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:clamp(44px,9vw,72px);color:var(--gold2);line-height:1.2;animation:rise 1.2s ease both}
.sub{color:var(--muted);font-weight:300;font-size:15px;margin-top:6px}
@keyframes rise{from{opacity:0;letter-spacing:.3em}to{opacity:1;letter-spacing:0}}
.rule{height:1px;max-width:220px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(28,14,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:6px;justify-content:center;padding:10px;overflow-x:auto}
nav button{background:none;border:1px solid transparent;color:var(--muted);font:inherit;font-size:15px;padding:6px 18px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--gold2);border-color:var(--gold)}
nav button:focus-visible,.add:focus-visible,.step button:focus-visible,.cta:focus-visible,.fab:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:28px 20px 140px}
h2{font-family:'Aref Ruqaa',serif;font-size:30px;color:var(--gold);margin-bottom:4px}
.note{color:var(--muted);font-size:14px;font-weight:300;margin-bottom:22px}
.item{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--line)}
.info{flex:1}
.top{display:flex;align-items:baseline;gap:10px}
.top h3{font-size:18px;font-weight:500}
.dots{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.price{color:var(--gold2);font-weight:500;white-space:nowrap}
.price small{color:var(--muted);font-weight:300;font-size:12px;margin-right:3px}
.desc{color:var(--muted);font-size:14px;font-weight:300;margin-top:2px}
.tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:4px;padding:0 8px}
.act{min-width:96px;display:flex;justify-content:flex-end;padding-top:2px}
.add{background:none;border:1px solid var(--gold);color:var(--gold2);font:inherit;font-size:14px;padding:4px 18px;border-radius:4px;cursor:pointer;transition:background .2s,color .2s}
.add:hover{background:var(--gold);color:var(--bg)}
.step{display:flex;align-items:center;gap:10px;border:1px solid var(--gold);border-radius:4px;padding:2px 4px}
.step button{background:none;border:0;color:var(--gold2);font-size:20px;width:28px;height:28px;cursor:pointer;line-height:1}
.step span{min-width:18px;text-align:center}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,0);background:var(--gold);color:#2a1308;border:0;font:inherit;font-weight:700;padding:14px 28px;border-radius:999px;cursor:pointer;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s,opacity .3s;z-index:8}
.fab.hide{transform:translate(-50%,120px);opacity:0;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel h2{margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .step{flex-shrink:0}
.total{display:flex;justify-content:space-between;font-size:18px;padding:16px 0 4px}
.total b{color:var(--gold2)}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ivory);font:inherit;padding:10px 12px;border-radius:6px;margin-top:10px}
input:focus{outline:2px solid var(--gold);border-color:transparent}
.cta{width:100%;margin-top:16px;background:var(--gold);color:#2a1308;border:0;font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:6px;cursor:pointer}
.ok{text-align:center;padding:20px 0}
.ok svg{width:56px;height:56px}
.empty{color:var(--muted);text-align:center;padding:24px 0}

.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:13px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:2px 14px;color:var(--ivory)}
.chips span:first-child{color:var(--gold2);border-color:var(--gold)}
.search{max-width:560px;margin:0 auto;padding:0 20px 18px}
.search input{margin-top:0;border-radius:999px;padding:11px 20px;background:var(--panel)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:10/7;background:#f1e6cf}
.pic svg{width:100%;height:100%;display:block}
.badge{position:absolute;top:8px;right:8px;background:rgba(28,14,19,.85);color:var(--gold2);font-size:12px;padding:0 9px;border-radius:999px}
.badge.t{right:auto;left:8px;color:var(--ivory)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
.cb h3{font-size:16px;font-weight:500;line-height:1.5}
.cb .desc{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.buy{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6px}
.buy .act{min-width:0;padding:0}
.buy .add{padding:3px 12px}

header{background:linear-gradient(180deg,#5c1628,#7a1f35);color:#fff}
h1{color:#f0d98c}.sub{color:#ecd9cc}
.chips span{border-color:rgba(255,255,255,.4);color:#fff}.chips span:first-child{color:#f0d98c;border-color:#f0d98c}
nav{background:rgba(250,246,238,.95)}
nav button[aria-selected=true]{color:var(--wine);border-color:var(--wine)}
h2{color:var(--wine)}
.badge{color:#f0d98c}.badge.t{color:#fff}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.card{box-shadow:0 6px 18px rgba(122,31,53,.08)}
.heart{position:absolute;bottom:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--wine);font-size:18px;cursor:pointer;line-height:1}
.add:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
.fab,.cta{background:var(--wine);color:#fff}
.fab:focus-visible,.cta:focus-visible{outline-color:var(--gold)}
.ai{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;background:#fff;color:var(--wine);border:1px solid var(--gold);font:inherit;font-weight:500;padding:9px 18px;border-radius:999px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.msgs{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:42vh;overflow:auto}
.m{padding:8px 14px;border-radius:14px;max-width:88%;font-size:14.5px;white-space:pre-wrap}
.m.u{background:var(--wine);color:#fff;align-self:flex-start}.m.a{background:#f3ead8;align-self:flex-end}
.qc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qc button{background:none;border:1px solid var(--gold);color:var(--gold2);font:inherit;font-size:13px;padding:2px 12px;border-radius:999px;cursor:pointer}
.cp{display:flex;gap:8px;margin-top:10px}.cp input{margin-top:0}.cp button{background:none;border:1px solid var(--gold);color:var(--gold2);font:inherit;border-radius:6px;padding:0 16px;cursor:pointer}
.cm{font-size:13px;color:var(--gold2);min-height:20px}
.trk{list-style:none;padding:0;margin:12px 0 4px;text-align:right}
.trk li{padding:5px 26px 5px 0;position:relative;color:var(--muted)}
.trk li:before{content:'';position:absolute;right:4px;top:13px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.trk li.on{color:var(--ivory)}.trk li.on:before{background:var(--gold);border-color:var(--gold)}

body{background:#ece5da}
#app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px 6px}
.brand{font-family:'Aref Ruqaa',serif;font-size:28px;color:var(--wine);font-weight:700}
.pill{background:#f7ecee;color:var(--wine);font-size:12.5px;padding:2px 14px;border-radius:999px}
.ic{justify-self:end;background:none;border:0;position:relative;color:var(--ivory);cursor:pointer;padding:6px}
.ic i{position:absolute;top:-2px;left:-2px;background:var(--wine);color:#fff;font-size:11px;font-style:normal;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.ic i:empty{display:none}
.search{max-width:none;padding:6px 16px 14px}.search input{background:#f4efe9;border:0;border-radius:12px;padding:11px 16px}

#tabs button{background:#f6f1ea;border:0;border-radius:14px;padding:10px 0 8px;font:inherit;font-size:12.5px;color:var(--ivory);cursor:pointer;display:flex;flex-direction:column;align-items:center}
#tabs button b{font-size:26px;line-height:1.4;font-weight:400}
#tabs button[aria-selected=true]{background:#f7ecee;outline:2px solid var(--wine)}

.ban .big{font-size:56px}
.deals{background:#f7ecee;padding:14px 0;margin-bottom:12px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px}
.dl{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory}
.dc{flex:0 0 190px;background:#fff;border-radius:14px;overflow:hidden;scroll-snap-align:start}
.dc .th{width:100%;height:auto;aspect-ratio:16/10;flex:none;border-radius:0}
.dc .bd{padding:8px 10px 10px}
.th{position:relative;flex:0 0 104px;width:104px;height:104px;border-radius:12px;overflow:hidden;background:#f1e6cf}
.th svg,.th img{width:100%;height:100%;object-fit:cover;display:block}
.off{position:absolute;top:8px;left:8px;background:#c62f4c;color:#fff;border-radius:6px;font-size:12px;padding:0 7px}
.row2{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.bd{flex:1;min-width:0;display:flex;flex-direction:column}
.bd h3{font-size:16px;font-weight:700}
.mt{font-size:12px;color:var(--muted)}
.old{text-decoration:line-through;color:var(--muted);font-size:12px;margin-left:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.sec h2{font-size:22px;margin:0}.sec span{color:var(--muted);font-size:13px}
.chips2{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.ch{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;font:inherit;font-size:13px;padding:2px 14px;cursor:pointer;color:var(--ivory)}
.ch[aria-pressed=true]{background:#f7ecee;border-color:var(--wine);color:var(--wine)}

main{max-width:none;padding:4px 16px 170px}
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bn button{background:none;border:0;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;cursor:pointer}.bn .on{color:var(--wine)}
.bn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}

:root{--ink:#2d1b45;--wine:#d9387a;--gold:#f2a93b;--gold2:#a85f00;--ivory:#2d1b45;--muted:#7b6b94;--line:#ecd9ef;--bg:#fff7fb}
body{background:#ffe6f1 radial-gradient(#ffc2db 1.5px,transparent 1.5px) 0 0/20px 20px}
#app{border-inline:2px solid var(--ink)}
.brand,h2,h3,.ban h3,.dh b,#tabs button,.ch,.add,.cta,.fab,.ai,.off,.price,.pill{font-family:'Lalezar','Vazirmatn',sans-serif;font-weight:400}
.bd h3,.dc h3{font-size:18px!important;line-height:1.5}
.brand{font-size:32px;color:var(--wine)}.brand:after{content:'✿';font-size:18px;color:#ff8fb1;margin-right:6px}
.sec h2{font-size:26px}.sec h2:after{content:' ✦';color:var(--gold)}
.pill{background:#ffe27a;color:var(--ink);border:2px solid var(--ink);font-size:14px;padding:0 14px}
.search input{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:11px 20px}
#tabs button{border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:14px;transition:transform .12s,box-shadow .12s}
#tabs button:nth-child(1){background:#ffd3e4}#tabs button:nth-child(2){background:#ffe0c8}#tabs button:nth-child(3){background:#fff0a8}#tabs button:nth-child(4){background:#cdf3e3}#tabs button:nth-child(5){background:#ddd2ff}
#tabs button[aria-selected=true]{outline:0;transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.ban{background:linear-gradient(135deg,#b9a6ff,#ff9ec4);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.ban h3{color:#fff;font-size:32px;text-shadow:2px 2px 0 var(--ink)}.ban p{color:var(--ink);font-weight:500}
.ban button{background:#ffe27a;color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-family:'Lalezar',sans-serif;font-weight:400;font-size:15px}
.mascot{flex:none;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
.deals{background:linear-gradient(180deg,#ffd9ea,#e6dcff);border-block:2px solid var(--ink)}
.dh b{font-size:22px}
.dc{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.th{border:2px solid var(--ink);border-radius:18px}.dc .th{border:0;border-bottom:2px solid var(--ink);border-radius:0}
.row2{border-bottom:2px dashed #f0cfe0}
.off{background:#ffe27a;color:var(--ink);border:2px solid var(--ink);transform:rotate(-6deg);font-size:13px}
.heart{border:2px solid var(--ink);width:30px;height:30px}
.tg{background:#d4f5e6;color:var(--ink);border:1.5px solid var(--ink);font-size:11.5px}
.price{font-size:18px;color:#c2185b}.price small{font-family:'Vazirmatn',sans-serif}
.add{background:#ffe27a;color:var(--ink);border:2px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font-size:15px;padding:2px 16px}
.add:hover{background:var(--wine);color:#fff;border-color:var(--ink)}
.add:active,.cta:active,.fab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.step{border:2px solid var(--ink);border-radius:999px;background:#fff}.step button{color:var(--wine)}
.ch{border:2px solid var(--ink);font-size:14px}.ch[aria-pressed=true]{background:#ddd2ff;color:var(--ink);border-color:var(--ink)}
.cta,.fab{background:var(--wine);color:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:17px}
.fab{transform:translate(-50%,0)}.fab.hide{transform:translate(-50%,120px)}

function art(i){if(PHOTO[i.id])return `<img src="${PHOTO[i.id]}" alt="${i.n}" loading="lazy">`;const [t,a,b]=ART[i.id];return `<svg viewBox="0 0 200 140" role="img" aria-label="${i.n}"><rect width="200" height="140" fill="#f1e6cf"/><ellipse cx="100" cy="90" rx="74" ry="30" fill="#ffffff" stroke="#c9a24d"/><ellipse cx="100" cy="88" rx="60" ry="22" fill="#f6efe0"/>${T[t](a,b)}</svg>`}
const rate = i => fa((4.2+(i.id*37%8)/10).toFixed(1));
const mins = i => fa(15+(i.id*5%4)*5);
function cardHTML(i){return `<div class="card"><div class="pic">${art(i)}<button class="heart" data-a="fav" data-i="${i.id}" aria-label="علاقه‌مندی">${fav.has(i.id)?'♥':'♡'}</button><span class="badge">★ ${rate(i)}</span><span class="badge t">${mins(i)} دقیقه</span></div><div class="cb"><h3>${i.n}</h3><p class="desc">${i.d}</p><div class="buy"><span class="price">${fa(i.p)}<small>تومان</small></span><div class="act">${actHTML(i)}</div></div></div></div>`}
const DEAL={5:.2,7:.15,9:.25,12:.1}; let sort='all', last=null;
const pr=i=>Math.round(i.p*(1-(DEAL[i.id]||0))/1000)*1000;
const rn=i=>4.2+(i.id*37%8)/10, mn=i=>15+(i.id*5%4)*5;
const priceHTML=i=>(DEAL[i.id]?`<span><span class="old">${fa(i.p)}</span>`:'<span>')+`<span class="price">${fa(pr(i))}<small>تومان</small></span></span>`;
const heart=i=>`<button class="heart" data-a="fav" data-i="${i.id}" aria-label="علاقه‌مندی">${fav.has(i.id)?'♥':'♡'}</button>`;
const offB=i=>DEAL[i.id]?`<span class="off">٪${fa(Math.round(DEAL[i.id]*100))}</span>`:'';
const rowHTML=i=>`<div class="row2"><div class="th">${art(i)}${heart(i)}${offB(i)}</div><div class="bd"><h3>${i.n}</h3><div class="mt">★ ${rate(i)} · ${mins(i)} دقیقه</div><p class="desc" style="margin:2px 0 4px">${i.d}</p><div><span class="tg">ارسال رایگان</span>${i.t?`<span class="tg">${i.t}</span>`:''}</div><div class="buy" style="margin-top:auto;padding-top:6px">${priceHTML(i)}<div class="act">${actHTML(i)}</div></div></div></div>`;
const dealHTML=i=>`<div class="dc"><div class="th">${art(i)}${heart(i)}${offB(i)}</div><div class="bd"><h3 style="font-size:15px">${i.n}</h3><div class="mt">★ ${rate(i)} · ${mins(i)} دقیقه</div><div class="buy" style="margin-top:8px">${priceHTML(i)}<div class="act">${actHTML(i)}</div></div></div></div>`;
function renderMenu(){
  const q=document.getElementById('q').value.trim();
  let its,title;
  if(q){its=all.filter(i=>i.n.includes(q)||i.d.includes(q));title='نتایج جستجو'}
  else{const c=M.find(x=>x.id===cat);its=cat==='f'?all.filter(i=>fav.has(i.id)):c.items;title=c.name}
  its=its.filter(passF); shown=its.length;
  if(sort==='price')its=[...its].sort((a,b)=>pr(a)-pr(b));
  if(sort==='rate')its=[...its].sort((a,b)=>rn(b)-rn(a));
  if(sort==='fast')its=[...its].sort((a,b)=>mn(a)-mn(b));
  document.getElementById('dealsBox').hidden=!!q;
  document.getElementById('dl').innerHTML=Object.keys(DEAL).map(id=>dealHTML(all.find(i=>i.id==id))).join('');
  menu.innerHTML=`<div class="sec"><h2>${title}</h2><span>${fa(its.length)} مورد</span></div><div class="chips2"><button class="ch" data-a="fopen" aria-pressed="${nF()>0}">⚙ فیلترها${nF()?` (${fa(nF())})`:''}</button>${nF()?'<button class="ch" data-a="fclear">حذف فیلترها</button>':''}${[['all','همه'],['rate','بیشترین امتیاز'],['price','ارزان‌ترین'],['fast','سریع‌ترین']].map(([k,t])=>`<button class="ch" data-a="sort" data-s="${k}" aria-pressed="${sort===k}">${t}</button>`).join('')}</div>`+(its.length?its.map(rowHTML).join(''):`<p class="empty">${nF()?'غذایی با این فیلترها پیدا نشد.':q?'غذایی با این نام پیدا نشد.':'با زدن ♡ روی هر غذا، اینجا ذخیره می‌شود.'}</p>`);
}
M.push({id:'f',name:'♥ محبوب‌ها',note:'غذاهایی که علامت زده‌اید',items:[]});
const final = () => Math.round(total()*(1-disc));
const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
const total = () => Object.entries(cart).reduce((s,[id,q])=>s+q*pr(all.find(i=>i.id==id)),0);
function renderFab(){
  const n = count(), fab = document.getElementById('fab'); document.getElementById('cb').textContent = n?fa(n):'';
  fab.classList.toggle('hide', n===0);
  document.getElementById('fabCount').textContent = fa(n)+' مورد';
  document.getElementById('fabTotal').textContent = fa(final())+' تومان';
}
function change(id,d){
  cart[id] = Math.max(0,(cart[id]||0)+d);
  if(!cart[id]) delete cart[id];
  renderMenu(); renderFab();
  if(sheet.classList.contains('open')) renderCart();
}
tabs.onclick = e => { const b=e.target.closest('button'); if(!b) return; cat=b.dataset.c; document.getElementById('q').value=''; renderTabs(); renderMenu(); document.getElementById('menu').scrollIntoView({behavior:'smooth'}); };
document.addEventListener('click', e => { const b=e.target.closest('[data-a]'); if(!b) return; if(b.dataset.a==='sort'){sort=b.dataset.s;renderMenu();return;} if(b.dataset.a==='fopen'){renderFilter();sheet.classList.add('open');return;} if(b.dataset.a==='fclear'){resetF();renderMenu();return;} if(b.dataset.a==='ft'){toggleF(b.dataset.k,+b.dataset.v);return;} if(b.dataset.a==='achg'){addrFrom='cart';addrSheet();return;} if(b.dataset.a==='amgr'){addrFrom='top';addrSheet();return;} if(b.dataset.a==='apick'){pickA(b.dataset.i);return;} if(b.dataset.a==='adel'){delA(b.dataset.i);return;} if(b.dataset.a==='anew'){addrForm();return;} if(b.dataset.a==='anewgps'){addrForm();document.getElementById('gps').click();return;} if(b.dataset.a==='atitle'){atitle=b.dataset.v;document.querySelectorAll('[data-a=atitle]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===atitle));return;} const id=+b.dataset.i; if(b.dataset.a==='fav'){fav.has(id)?fav.delete(id):fav.add(id);renderMenu();} else change(id, b.dataset.a==='inc'?1:-1); });

const sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
function renderCart(){
  const rows = Object.entries(cart).map(([id,q])=>{const i=all.find(x=>x.id==id);return `<div class="row"><div><div>${i.n}</div><small style="color:var(--muted)">${fa(pr(i)*q)} تومان</small></div>
    <div class="step"><button data-a="inc" data-i="${i.id}" aria-label="افزودن">+</button><span>${fa(q)}</span><button data-a="dec" data-i="${i.id}" aria-label="کم کردن">−</button></div></div>`}).join('');
  if(!rows){ closeSheet(); return; }
  panel.innerHTML = `<h2>سبد سفارش</h2>${rows}
    <div class="cp"><input id="cp" placeholder="کد تخفیف"><button id="cpb">اعمال</button></div><p class="cm" id="cm">${disc?'کد تخفیف ۱۰٪ اعمال شد':''}</p>
    <div class="total"><span>جمع کل</span><b id="tt">${fa(final())} تومان</b></div>
    ${user?'':'<p class="note" style="margin:10px 0 0">ثبت‌نام نکرده‌اید؟ از «حساب من» ثبت‌نام کنید تا اطلاعات شما ذخیره شود.</p>'}<input id="nm" placeholder="نام و نام خانوادگی" autocomplete="name">
    <div class="adc" id="adc"></div>
    <button class="cta" id="go">ثبت سفارش</button>`;
  document.getElementById('go').onclick = submit;
  if(user){document.getElementById('nm').value=user.name;} renderAdc();
  document.getElementById('cpb').onclick = () => { const ok=document.getElementById('cp').value.trim().toUpperCase()==='NEGIN10'; if(ok)disc=.1; document.getElementById('cm').textContent=ok?'کد تخفیف ۱۰٪ اعمال شد':'این کد معتبر نیست'; document.getElementById('tt').textContent=fa(final())+' تومان'; };
}
function submit(){
  const nm=document.getElementById('nm'); const A=curAddr();
  if(!nm.value.trim()){ nm.focus(); nm.placeholder='این فیلد را پر کنید'; return; }
  if(!A){ addrFrom='cart'; addrForm(); return; }
  const code = fa(Math.floor(1000+Math.random()*9000)); last={code,total:final(),t:Date.now(),addr:A.title+': '+A.text};
  panel.innerHTML = `<div class="ok"><svg viewBox="0 0 56 56" fill="none" stroke="#c9a24d" stroke-width="2"><circle cx="28" cy="28" r="25"/><path d="M17 29l8 8 14-16"/></svg>
    <h2 style="margin-top:10px">سفارش ثبت شد</h2><p class="note">کد پیگیری ${code}. سفارش شما حدود ${fa(40)} دقیقه دیگر به ${esc(nm.value.trim())} (${esc(A.title)}) تحویل داده می‌شود.</p><ol class="trk" id="trk"><li class="on">سفارش دریافت شد</li><li>در حال آماده‌سازی</li><li>ارسال با پیک</li><li>تحویل به شما</li></ol>
    <button class="cta" id="done">بازگشت به منو</button></div>`;
  Object.keys(cart).forEach(k=>delete cart[k]); renderMenu(); renderFab();
  document.getElementById('done').onclick = closeSheet; disc=0;
  let k=0; const ls=[...document.querySelectorAll('#trk li')]; const tm=setInterval(()=>{k++; ls.forEach((l,j)=>l.classList.toggle('on',j<=k)); if(k>=3)clearInterval(tm);},2500);
}
function closeSheet(){ sheet.classList.remove('open'); }
document.getElementById('fab').onclick = () => { renderCart(); sheet.classList.add('open'); };
document.getElementById('scrim').onclick = closeSheet;
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeSheet(); aiS.classList.remove('open'); } });

document.getElementById('q').oninput=renderMenu;

let sample=null; const hist=[]; const aiS=document.getElementById('aiSheet'), msgs=document.getElementById('msgs'), aiIn=document.getElementById('ai-in');
if(window.claude) claude.use('sample').then(x=>{ if(x){ sample=x; document.getElementById('aiBtn').hidden=false; } }).catch(()=>{});
const addMsg=(c,t)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
const ctx=()=>`تو «دستیار نگین» هستی، مشاور و پشتیبان رستوران ایرانی نگین. فارسی، مودب و کوتاه (حداکثر ۳ جمله) پاسخ بده. فقط از منوی زیر پیشنهاد بده. ارسال ۳۰ تا ۴۰ دقیقه و رایگان است؛ کد NEGIN10 ده درصد تخفیف می‌دهد. وقتی کاربر خواست غذایی را سفارش دهد از ابزار add_to_cart استفاده کن. برای شکایت یا مشکل پرداخت بگو با پشتیبانی تلفنی تماس بگیرد.\nمنو: ${JSON.stringify(all.map(i=>({id:i.id,n:i.n,d:i.d,p:pr(i)})))}\nسبد فعلی (شناسه:تعداد): ${JSON.stringify(cart)}`;
async function ask(text){
  if(!sample||!text.trim()) return;
  addMsg('u',text); hist.push({role:'user',content:text}); aiIn.value='';
  const out=addMsg('a','…');
  const turns=hist.slice(0,-1).concat({role:'user',content:ctx()+'\n\nپیام کاربر: '+text});
  try{
    const r=await sample(turns,{cache:false,onText:({text})=>{out.textContent=text},tools:[{name:'add_to_cart',description:'افزودن یک غذا به سبد با شناسه منو',inputSchema:{type:'object',properties:{id:{type:'number'},qty:{type:'number'}},required:['id']},execute:({id,qty})=>{if(!all.find(i=>i.id==id))throw new Error('شناسه نامعتبر');change(id,Math.max(1,qty||1));return {ok:true}}}]});
    out.textContent=r.text; hist.push({role:'assistant',content:r.text});
  }catch(e){ hist.pop(); out.textContent=e&&e.code==='not_granted'?'برای استفاده از دستیار، اجازه دسترسی را تأیید کنید.':'اکنون پاسخگو نیستم. کمی بعد دوباره تلاش کنید یا با پشتیبانی تلفنی تماس بگیرید.'; }
}
document.getElementById('qc').innerHTML=['چه چیزی سفارش بدهم؟','هزینه و زمان ارسال','پیشنهاد برای دو نفر','مشکل در سفارش دارم'].map(t=>`<button>${t}</button>`).join('');
document.getElementById('qc').onclick=e=>{const b=e.target.closest('button'); if(b) ask(b.textContent)};
document.getElementById('aiBtn').onclick=()=>{aiS.classList.add('open'); if(!msgs.children.length) addMsg('a','سلام! من دستیار نگین هستم. می‌توانم غذا پیشنهاد بدهم، به سبد اضافه کنم یا به سؤال‌هایتان درباره ارسال و سفارش جواب بدهم.');};
document.getElementById('ai-go').onclick=()=>ask(aiIn.value);
aiIn.onkeydown=e=>{if(e.key==='Enter')ask(aiIn.value)};
document.getElementById('aiScrim').onclick=()=>aiS.classList.remove('open');

const ST=['سفارش دریافت شد','در حال آماده‌سازی','ارسال با پیک','تحویل به شما'];
function showSheet(h){panel.innerHTML=h+'<button class="cta" id="x">بستن</button>';document.getElementById('x').onclick=closeSheet;sheet.classList.add('open')}
document.getElementById('cartBtn').onclick=()=>{ if(count()){renderCart();sheet.classList.add('open')} else showSheet('<h2>سبد سفارش</h2><p class="empty">سبد شما خالی است.</p>') };
document.getElementById('bn').onclick=e=>{const b=e.target.closest('button'); if(!b) return; const n=b.dataset.n;
  if(n==='home') window.scrollTo({top:0,behavior:'smooth'});
  else if(n==='ord'){ if(!last) showSheet('<h2>سفارش‌ها</h2><p class="empty">هنوز سفارشی ثبت نکرده‌اید.</p>'); else {const k=Math.min(3,Math.floor((Date.now()-last.t)/2500)); showSheet(`<h2>سفارش‌ها</h2><div class="row"><div>سفارش ${last.code}<br><small style="color:var(--muted)">${fa(last.total)} تومان</small><br><small style="color:var(--muted)">${esc(last.addr||'')}</small></div></div><ol class="trk">${ST.map((t,j)=>`<li class="${j<=k?'on':''}">${t}</li>`).join('')}</ol>`);} }
  else accountSheet();
  const sp=document.getElementById('sup'); if(sp) sp.onclick=()=>{closeSheet();document.getElementById('aiBtn').click()};
};
document.getElementById('bnb').onclick=function(){disc=.1;this.textContent='کد اعمال شد ✓';renderFab()};
const cdEl=document.getElementById('cd'), dg=x=>String(x).padStart(2,'0').replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
function tick(){const d=new Date(),e=new Date(d);e.setHours(23,59,59,999);const t=Math.floor((e-d)/1000);cdEl.textContent=[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(dg).join(':')}
tick(); setInterval(tick,1000);

const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toEn=t=>t.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const VEG=new Set([1,3,4,10,11,12,13,14,15]);
let F={veg:false,deal:false,rate:false,fast:false,price:0}, shown=0;
const resetF=()=>{F={veg:false,deal:false,rate:false,fast:false,price:0}};
const nF=()=>[F.veg,F.deal,F.rate,F.fast].filter(Boolean).length+(F.price?1:0);
const passF=i=>(!F.veg||VEG.has(i.id))&&(!F.deal||DEAL[i.id])&&(!F.rate||rn(i)>=4.5)&&(!F.fast||mn(i)<=20)&&(!F.price||(F.price===1?pr(i)<200000:F.price===2?pr(i)>=200000&&pr(i)<=600000:pr(i)>600000));
function toggleF(k,v){ if(k==='price') F.price=F.price===v?0:v; else F[k]=!F[k]; renderMenu(); renderFilter(); }
function renderFilter(){
  const ch=(k,t,on,v=0)=>`<button class="ch" data-a="ft" data-k="${k}" data-v="${v}" aria-pressed="${on}">${t}</button>`;
  panel.innerHTML=`<h2>فیلترها</h2><p class="note">نوع غذا</p><div class="fw">${ch('veg','بدون گوشت',F.veg)}${ch('deal','تخفیف‌دار',F.deal)}</div><p class="note">امتیاز و زمان</p><div class="fw">${ch('rate','امتیاز ۴٫۵ به بالا',F.rate)}${ch('fast','آماده‌سازی تا ۲۰ دقیقه',F.fast)}</div><p class="note">محدوده قیمت</p><div class="fw">${ch('price','زیر ۲۰۰ هزار تومان',F.price===1,1)}${ch('price','۲۰۰ تا ۶۰۰ هزار',F.price===2,2)}${ch('price','بالای ۶۰۰ هزار',F.price===3,3)}</div><button class="cta" id="fok">نمایش ${fa(shown)} مورد</button><button class="cta" id="fclr" style="background:#fff;color:var(--ink);margin-top:10px">حذف فیلترها</button>`;
  document.getElementById('fok').onclick=closeSheet;
  document.getElementById('fclr').onclick=()=>{resetF();renderMenu();renderFilter()};
}
let user=null; try{user=JSON.parse(localStorage.getItem('negin_user')||'null')}catch(e){}
const saveU=()=>{try{user?localStorage.setItem('negin_user',JSON.stringify(user)):localStorage.removeItem('negin_user')}catch(e){}};
function accountSheet(){
  if(user){
    showSheet(`<h2>سلام ${esc(user.name)}</h2><p class="note">موبایل: ${esc(user.phone)}<br>آدرس: ${esc(curAddr()?curAddr().text:user.addr)}<br>${fa(fav.size)} غذای محبوب</p><button class="cta" data-a="amgr" style="margin-bottom:10px">آدرس‌های من</button>${sample?'<button class="cta" id="sup" style="margin-bottom:10px">گفتگو با پشتیبانی</button>':''}<button class="cta" id="lo" style="background:#fff;color:var(--ink)">خروج از حساب</button><p class="note" style="margin-top:12px">پشتیبانی تلفنی: <a href="tel:02100000000" style="color:var(--wine)">۰۲۱-۰۰۰۰۰۰۰۰</a></p>`);
    document.getElementById('lo').onclick=()=>{user=null;saveU();closeSheet()};
    const sp2=document.getElementById('sup'); if(sp2) sp2.onclick=()=>{closeSheet();document.getElementById('aiBtn').click()};
  } else {
    showSheet(`<h2>ثبت‌نام</h2><p class="note">با ثبت‌نام، نام و آدرس شما در هر سفارش خودکار پر می‌شود.</p><input id="rn" placeholder="نام و نام خانوادگی" autocomplete="name"><input id="rp" inputmode="tel" placeholder="شماره موبایل، مثلاً ۰۹۱۲۳۴۵۶۷۸۹" autocomplete="tel"><input id="ra" placeholder="آدرس تحویل" autocomplete="street-address"><p class="cm" id="re" style="color:#c2185b"></p><button class="cta" id="rg">ثبت‌نام</button>`);
    document.getElementById('rg').onclick=()=>{
      const n=document.getElementById('rn').value.trim(), ph=toEn(document.getElementById('rp').value.trim()), a=document.getElementById('ra').value.trim(), er=document.getElementById('re');
      if(n.length<3) return er.textContent='نام و نام خانوادگی را کامل بنویسید.';
      if(!/^09\d{9}$/.test(ph)) return er.textContent='شماره موبایل باید با ۰۹ شروع شود و ۱۱ رقم باشد.';
      if(a.length<8) return er.textContent='آدرس را کامل‌تر بنویسید.';
      user={name:n,phone:ph,addr:a}; saveU(); if(!addrs.length) addAddr('خانه',a,''); accountSheet();
    };
  }
}

let addrs=[], cur=null, addrFrom='top', atitle='خانه';
try{const d=JSON.parse(localStorage.getItem('negin_addrs')||'null'); if(d){addrs=d.list||[];cur=d.cur||null}}catch(e){}
if(user&&user.addr&&!addrs.length){addrs.push({id:'a0',title:'خانه',text:user.addr,detail:''});cur='a0'}
const saveA=()=>{try{localStorage.setItem('negin_addrs',JSON.stringify({list:addrs,cur}))}catch(e){}};
const curAddr=()=>addrs.find(a=>a.id===cur)||null;
function renderAddrBtn(){const A=curAddr();document.getElementById('addrBtn').textContent=A?`📍 ${A.title} · ${A.text} ⌄`:'📍 انتخاب آدرس ⌄'}
function addAddr(title,text,detail,geo){const a={id:'a'+Date.now(),title,text,detail,geo:geo||null};addrs.push(a);cur=a.id;saveA();renderAddrBtn()}
function renderAdc(){const A=curAddr(),el=document.getElementById('adc'); if(!el) return;
  el.innerHTML=A?`<div class="ad on"><div><b>${esc(A.title)}</b><div class="mt">${esc(A.text)}${A.detail?' · '+esc(A.detail):''}${A.geo?' · 📍 موقعیت GPS':''}</div></div><button class="ch" data-a="achg">تغییر</button></div>`:`<button class="ch" data-a="achg" style="width:100%;padding:10px">📍 افزودن آدرس تحویل</button>`}
function afterAddr(){ if(addrFrom==='cart'&&count()) renderCart(); else closeSheet(); }
function pickA(id){cur=id;saveA();renderAddrBtn();afterAddr()}
function delA(id){addrs=addrs.filter(a=>a.id!==id); if(cur===id) cur=addrs[0]?addrs[0].id:null; saveA();renderAddrBtn();addrSheet()}
function addrSheet(){
  if(!addrs.length) return addrForm();
  showSheet(`<h2>آدرس تحویل</h2><p class="note">ارسال رایگان · ۳۰ تا ۴۰ دقیقه</p>${addrs.map(a=>`<div class="ad" data-a="apick" data-i="${esc(a.id)}" aria-pressed="${a.id===cur}"><div><b>${esc(a.title)}</b><div class="mt">${esc(a.text)}${a.detail?' · '+esc(a.detail):''}${a.geo?' · 📍 موقعیت GPS':''}</div></div><button class="ch" data-a="adel" data-i="${esc(a.id)}" aria-label="حذف آدرس">حذف</button></div>`).join('')}<button class="cta" data-a="anew" style="margin-bottom:10px">+ افزودن آدرس جدید</button><button class="cta" data-a="anewgps" style="background:#fff;color:var(--ink);margin-bottom:10px">📍 افزودن با موقعیت فعلی</button>`);
}
function addrForm(){
  atitle='خانه';
  showSheet(`<h2>آدرس جدید</h2><div class="fw">${['خانه','محل کار','دیگر'].map(t=>`<button class="ch" data-a="atitle" data-v="${t}" aria-pressed="${t==='خانه'}">${t}</button>`).join('')}</div><button class="ch" id="gps" type="button" style="width:100%;padding:10px">📍 استفاده از موقعیت فعلی من</button><p class="cm" id="gs"></p><input id="at" placeholder="شهر، محله و خیابان" autocomplete="street-address"><div class="two"><input id="ap" placeholder="پلاک"><input id="au" placeholder="واحد"></div><input id="ao" placeholder="توضیحات برای پیک (اختیاری)"><p class="cm" id="ae" style="color:#c2185b"></p><button class="cta" id="asv" style="margin-bottom:10px">ذخیره آدرس</button>`);
  let gpos=null; const gs=document.getElementById('gs');
  document.getElementById('gps').onclick=()=>{
    if(!navigator.geolocation){gs.textContent='این مرورگر موقعیت‌یاب ندارد. آدرس را دستی بنویسید.';return}
    gs.textContent='در حال دریافت موقعیت…';
    try{ navigator.geolocation.getCurrentPosition(pos=>{
      gpos={lat:+pos.coords.latitude.toFixed(5),lng:+pos.coords.longitude.toFixed(5)};
      gs.textContent='موقعیت شما ثبت شد (دقت حدود '+fa(Math.round(pos.coords.accuracy))+' متر). حالا شهر، محله و خیابان را هم بنویسید.';
      document.getElementById('at').focus();
    },err=>{ gs.textContent=err.code===1?'اجازه دسترسی به موقعیت داده نشد. آدرس را دستی بنویسید.':'دریافت موقعیت ممکن نشد. آدرس را دستی بنویسید.'; },{enableHighAccuracy:true,timeout:10000}); }
    catch(e){ gs.textContent='دریافت موقعیت ممکن نشد. آدرس را دستی بنویسید.'; }
  };
  document.getElementById('asv').onclick=()=>{
    const t=document.getElementById('at').value.trim(), pl=document.getElementById('ap').value.trim(), un=document.getElementById('au').value.trim(), o=document.getElementById('ao').value.trim();
    if(t.length<8) return document.getElementById('ae').textContent='شهر، محله و خیابان را کامل‌تر بنویسید.';
    addAddr(atitle,t,[pl&&'پلاک '+pl,un&&'واحد '+un,o].filter(Boolean).join('، '),gpos); afterAddr();
  };
}
document.getElementById('addrBtn').onclick=()=>{addrFrom='top';addrSheet()};
renderAddrBtn();
renderTabs(); renderMenu(); renderFab();
</script>
